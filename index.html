<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141518" />
    <meta
      name="description"
      content="Kickstand — a digital garage for motorcycle owners. Service schedules, fuel economy, rides, papers and costs for every bike."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Kickstand — Motorcycle Garage</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('kickstand.v1') || '{}');
        var t = s && s.state && s.state.settings && s.state.settings.theme;
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
